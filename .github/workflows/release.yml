# Builds the portable Windows exe whenever you push a tag like v2.0.0
name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:win
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
